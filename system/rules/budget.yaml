# rules/budget.yaml —— 第 6 步核验的三类预算上限（Ch6 §D.5 / §N6.3-08/09）
#
# 权威出处：`Ch6 §D.5`（三类预算取先到者；"具体数值落在 `rules/budget.yaml`（**实现方配置**）"）
#           `Ch11 §D.2 p09`（"公开数据与预算"：仅公开信息已确认；**可用接口 / 费用 / 预算实现方列明**）
#           `00_开发Agent开工提示词 §6.1`（缺值必须有**明确兜底或明确降级**，禁静默兜底）
#
# 结构与读取（`scripts/evidence/budget_gate.py`）：
#   `_configured_source()` 的解析顺序 = **本文件** ＞ `freeze p09` 的数值映射 ＞ 调用方显式 `defaults`；
#   三者皆无 → 抛 `BudgetConfigMissing`（**响亮失败**，绝不静默取 `0`/`None`）。
#   本文件存在时**整份**作为 `raw`，故下面三个键必须在**顶层**。
# ★ `None` ≠ `0`（`G5`）：`None` = **未设上限**；`0` = **上限为 0**（不允许任何调用/检索）。
#   二者不得混同，`0` 绝不静默当"无上限"。
#
# ★ 安装记录：2026-09-17 需求方裁定「均采用建议值」后由主理人安装。
#   此前 `rule_key_alignment_guard::KNOWN_ABSENT_RULE_FILES` 为它保留了一条
#   「按设计刻意未安装」的登记，其**预期消失条件 = 「第十一章『检索/模型预算』参数冻结后填入」** ——
#   本次安装即**满足该条件**，故那条登记**已同步撤除**。
#
# ★★ 为什么三个值都是 `null`（这是**明确降级**，不是"没填"）：
#   `Ch6 §D.5` 把具体数值划给**实现方配置**，而 `p09` 的预算值本身为 `tbd`
#   （`suggested_value.budget = "tbd"`，`00_待拍板项清单` 亦未给预算档位）
#   ⇒ **实现方在三类上限上都没有可依据的外部输入**，编一个数字即属"臆造业务阈值"
#     （本仓明令禁止：不填入猜测的事实数值）。
#   ⇒ 取 `null` 的后果是**确定的、可解释的**：
#      · `deadline: null`        → 不设时间上限（`_time_ratio` 返回 0.0，时间类不触限）
#      · `max_model_calls: null` → **计算上限 = `research_cap(importance)`**
#        （`Ch6 §B.2` 的唯一真源，`triage.py::BUDGET_MAP`）—— 这不是"无上限"，而是**有确定上界**
#      · `max_searches: null`    → 不设检索次数上限（只受时间/计算两类约束）
#   ⇒ 即：**三类取先到者仍然成立**，其中计算类有真实上界，另两类当前不设限。
#   ★ 要收紧时**只改本文件**（`config/__init__.py`：`get_param` 不硬编码，改值即生效、无需改代码）。

version: 1
spec_anchor: "Ch6 §D.5"

# 时间预算（任务截止时刻，ISO 8601 或 `null`）。
# `null` = 不设时间上限（明确降级）。设值示例：`2026-09-18T22:00:00+08:00`
deadline: null

# 计算预算（模型调用数上限）。
# `null` = **未配置** ⇒ 有效上限 = `research_cap(importance)`（`Ch6 §B.2`；`0` 则表示"不允许任何调用"）。
max_model_calls: null

# 检索预算（检索次数上限）。
# `null` = 不设检索上限（明确降级；`0` 表示"不允许任何检索"）。
max_searches: null
