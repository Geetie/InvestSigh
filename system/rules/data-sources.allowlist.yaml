# rules/data-sources.allowlist.yaml —— 数据源许可与预算（Ch9 §3.4.11 / Ch11 §D.2 p09）
#
# 权威出处：`Ch9 §3.4.11 数据源 allowlist（含决策 D-01）` / `Ch11 §D.2 p09`
# 落位说明：`00_交付施工图 §3.1` 写 `registry/data-sources.allowlist.yaml`，
#   而 `Ch9 §3.4.11` 与 `Ch11 §D.2` 均写 `rules/data-sources.allowlist.yaml`。
#   按 `00_交付施工图 §0 第 4 条`（本图不替设计做决定，组件细节以各章 02 为准）**采 rules/**；
#   该路径分歧已登记于 `system/reports/phase1_open_tensions.md`，**待需求方确认**。
#
# ★ D-01（2026-09-15 已拍板）：iFinD / pandadata MCP 连接器**有免费额度，暂不视为"付费数据订阅"**。
#   → 标 `license_tier=free_quota` / `cost=0`；**不得写入裁决逻辑**（仍须走 Ch6 分级与证据质量流程）；
#   → **若未来转为付费，须按 Ch2 §N2.1-14 重新评估**。
#
# ★ 变更记录（`N6.1-13`「数据来源白名单 + 变更审批」）：
#   2026-09-17 **需求方批准补入 `tdx`（通达信 MCP 连接器）**。依据与逐项实测见
#   `system/reports/mcp_setup_brief.md`：tdx 是当时三个可用源中**唯一同时**提供
#     ① 延迟分钟数（`DelayHQMin: 15`，实测）② 三复权口径（不复权/前复权/后复权，实测可区分）
#     ③ 公司行动表（分红·拆股，含除息日/每股派息/登记日/派发日/拆股比率）的源；
#   而这三项分别是 `N9.3-04`（可预期延迟）/ `N9.3-08` + T11（公司行动与复权口径）的必需输入，
#   且 `iFinD` 实测在**美股与基金两个市场**都取不到公司行动（详见该报告 §四）。
#   ★ 该连接器**在补登记之前就已连在宿主上并被用于取数** —— 本次是**事后补登记**，
#     使其从"未授权源"转为在册源，**不是新增采购**；`license_tier` 取 `free_quota`
#     （未发生付费订阅；若未来转为付费，按 `Ch2 §N2.1-14` 重评）。
#
# ★ 单一真源纪律：本文件**不另存** p09 的预算值；预算值只在 `rules/freeze.yaml::p09`。
# 只读：0444 + SHA256。

version: 1
spec_anchor: "Ch9 §3.4.11"
param_ref: p09                             # ← 指针：p09 的值只在 rules/freeze.yaml
decision_anchor: "D-01（2026-09-15）"

# 消歧：这里是 `license_tier`（数据源许可），**不是** `tier`（来源分级）
#       —— Ch2 §C.2 R-18 / `Ch9 §3.4.11` v1.1 回改 R-18。
tier_field_name: license_tier

sources:
  - id: westock
    kind: mcp_connector
    license_tier: free_quota
    cost: 0
    may_enter_first_version: true
    may_enter_decision_logic: false        # ★ 不得写入裁决逻辑
    reassessment_rule: "若转为付费，按 Ch2 §N2.1-14 重评"
  - id: iFinD
    kind: mcp_connector
    license_tier: free_quota
    cost: 0
    may_enter_first_version: true
    may_enter_decision_logic: false
    reassessment_rule: "若转为付费，按 Ch2 §N2.1-14 重评"
  - id: pandadata
    kind: mcp_connector
    license_tier: free_quota
    cost: 0
    may_enter_first_version: true
    may_enter_decision_logic: false
    reassessment_rule: "若转为付费，按 Ch2 §N2.1-14 重评"
  - id: tdx
    kind: mcp_connector
    license_tier: free_quota
    cost: 0
    may_enter_first_version: true
    may_enter_decision_logic: false        # ★ 不得写入裁决逻辑
    reassessment_rule: "若转为付费，按 Ch2 §N2.1-14 重评"
    # ★ 本条与 westock / iFinD / pandadata **保持逐字段同构**：变更依据（批准日期、`N6.1-13`、
    #   实测证据出处）写在**文件头注释**里，**不新增** `approved_at` / `approval_anchor` /
    #   `evidence_ref` 这类元数据键 —— 它们会被 `rule_key_alignment_guard` 判为
    #   「**在机器上零效力**的声明」（`T-18` 家族）而**响亮判红**。这是本次实测到的：
    #   我初版加了那三个键 ⇒ 门禁立刻 FAIL（3 violations）。处置择「删键、依据留在注释」，
    #   而不是把它们登记进豁免表（后者是降噪，前者是**收敛到同构**）。
  - id: websearch_webfetch
    kind: builtin_capability
    license_tier: free_quota
    cost: 0
    may_enter_first_version: true
    may_enter_decision_logic: false
    note: "公开网页采集（IR / 媒体 / KOL / 视频），尊重登录、付费与访问限制"

budget_policy:
  data_scope: public_only                  # 仅公开信息（源稿第 169 行）
  budget_value: tbd                        # ← 值只在 rules/freeze.yaml::p09
  paid_subscription_as_first_version_launch_condition: false   # ★ 红线二（Ch11 §E.2）

# ── 首版启动条件关联（Ch11 §E.2 / registry/launch_criteria.yaml）────────────
launch_criteria_ref: registry/launch_criteria.yaml
