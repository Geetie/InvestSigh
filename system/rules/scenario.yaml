# rules/scenario.yaml —— 情景定义与情景方法状态
#
# 权威出处：`05_价格与市场预期研究/02_实现方案.md §E.3`（情景口径一致性检查：`assert_scenario_match`）
#           `§E.4`（`scenario_method_status = pending` 的落地 + 转正流程）
#           `§D.6`（区间宽度表达 + 概率字段默认 `null`）
#           `§J.4`（情景标签体系：定义 `{bear, neutral, bull, custom}`）/ `§J.5`（`scenario_method_status` 转正条件）
#           标签取值出处：`00_待拍板项清单.md` **J4/J5（05/02）**；概率口径出处：**B11 / D-03**
# 落位复核：`00_交付施工图.md` §3.1 第 135 行（`rules/scenario.yaml` + `scripts/pricelayer/scenario_guard.py`
#           = 情景一致性 + `probability` 默认 null · Ch5 §E）/ §6 第 255 行（情景定义 + `scenario_method_status` · 阶段②）
#
# ★ 逐字转写纪律：每个键都能指回**设计节号 + 原文片段**；设计未给值 ⇒ `tbd` + `basis`；
#   设计没写的键**不新增**。逐键对照表见 `system/reports/ws_ch2_rules_report.md`。
#
# ★ 单一真源纪律（`Ch11 §D.2`）：本文件**含 1 处指针** —— "个股与基准**同期间同情景**"与"方法版本化"
#   的值是 `rules/freeze.yaml::p05`（`return_forecast_method` 的
#   `same_period_same_scenario_as_benchmark: true` / `method_versioning: required`）的取值面，
#   本文件**只声明校验器入口与受检字段，不复制该值**（见下面 `scenario_consistency.param_ref`）。
#
# 只读（安装后）：0444 + SHA256。

version: 1
spec_anchor: "Ch5 §E.3 / §E.4"

# ── 情景标签体系（`§J.4`）────────────────────────────────────────────────
scenario_tags: [bear, neutral, bull, custom]   # §J.4：「情景标签体系 | 枚举 | 定义 `{bear, neutral, bull, custom}`」
first_version_tag_policy: "仅用一致标签"        # §J.4 逐字：「首版仅用一致标签」

# ── 情景口径一致性（`§E.3`）──────────────────────────────────────────────
scenario_consistency:
  param_ref: p05                           # ★ 指针：「同期间同情景」与「方法版本化」的值只在 `rules/freeze.yaml::p05`——本文件不复制
  param_ref_note: "p05 `return_forecast_method` 承载 `same_period_same_scenario_as_benchmark: true` / `method_versioning: required`；§E.4 逐字「+ 记 `method_version`」亦走 p05，故此处只留指针（单一真源，防双写）"
  guard: scripts/pricelayer/scenario_guard.py   # §E.3 代码块路径逐字 / 施工图 §3.1 第 135 行
  entry: assert_scenario_match                  # §E.3 函数名逐字
  checked_fields: [stock.scenario_tag, benchmark.scenario_tag]   # §E.3：`if stock.scenario_tag != benchmark.scenario_tag`
  on_mismatch: raise ScenarioMismatch           # §E.3 逐字：「raise ScenarioMismatch(stock.scenario_tag, benchmark.scenario_tag)  # 拒绝生成相对判断」
  downstream_effect: "拒绝生成相对判断"          # §E.3 逐字
  forbidden_comparison: "个股乐观情景 vs 基准悲观情景"   # §E.3 单测逐字：「**不能比较个股乐观情景与基准悲观情景**（N5.4-08）」

# ── 情景方法状态（`§E.4`）────────────────────────────────────────────────
scenario_method_status: pending            # §E.4 yaml 块逐字：`scenario_method_status: pending | neutral | probability_weighted    # 默认 pending`
scenario_method_status_domain: [pending, neutral, probability_weighted]   # §E.4 取值域逐字
scenario_method_status_note: "§E.4：「首版方法（中性情景 vs 概率加权）未定 → **显式 `pending`，不静默默认**（N5.4-07 / C45-2）」"
#   ★ 张力（已登记，不擅自改指针）：本项与 `rules/freeze.yaml::p05`（`return_forecast_method`：`algorithm: tbd`
#     / `resolved_at: delivery_stage_2`）同属"样例校准后转正"家族，但 `§E.4`/`§J.5` **未把它写成 p05 的取值**，
#     故照设计逐字落 `pending`，不擅自改为 `param_ref: p05`。详见报告「剩余不确定性与缺口」。

scenario_method_blocking:
  when: "scenario_method_status == pending"    # §E.4 逐字条件
  effect: "assert_scenario_match 无法建立一致口径 → **阻塞相对判断生成**"   # §E.4 逐字
  downstream_output: "待判断（而非建议）"        # §E.4 逐字：「第七章前置门收不到可用的 `benchmark_forecast`，输出"待判断"而非建议」
  required_field_at_downstream: benchmark_forecast   # §E.4 逐字

scenario_method_promotion:
  trigger: "样例确定后"                        # §E.4 逐字：「待定转正流程：样例确定后 → 写 `rules/scenario.yaml`（版本化）」
  requires_versioned_file: true                # §E.4 逐字（版本化）；§J.5：「样例通过 + `rules/scenario.yaml` 版本化」
  target_status: [neutral, probability_weighted]   # §E.4 逐字：「`status` 转 `neutral`/`probability_weighted`」
  record_method_version: true                  # §E.4 逐字：「+ 记 `method_version`」（值面见 p05 指针）
  promotion_condition_source: "05/02 J5"       # §J.5：「`scenario_method_status` 转正条件 | 待样例 | 样例通过 + `rules/scenario.yaml` 版本化」

# ── 概率字段默认 null（`§D.6` / 清单 B11；施工图 §3.1 第 135 行归入本文件+`scenario_guard.py`）──
probability:
  default: null                              # §D.6 逐字：「**情景概率默认 `null`**（不默认 50/50）：`probability: null`」
  required: false                            # §D.6 单测逐字：`assert "probability" not in required_fields`
  must_be_null_50_50: false                  # §D.6 逐字：「不默认 50/50」
  fill_condition: "须为 `DerivedValue` 且标注来源"   # 清单 B11 逐字（`05/02` J9：「须为 DerivedValue 且标注来源」）
  fill_condition_anchor: "05/02 §J.9"

# ── 区间表达（`§D.6`）────────────────────────────────────────────────────
range_expression:
  field: range                               # §D.6 逐字：「区间用 `range{low, high}` 表达宽度」
  keys: [low, high]                          # §D.6 逐字
  wrap_wide_range_as_precise_forecast: false # §D.6 逐字：「**不把宽泛区间包装成精确预测**（N5.3-06）」
