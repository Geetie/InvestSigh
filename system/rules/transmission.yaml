# rules/transmission.yaml —— 传导参数真源（Ch7 §C.5 / §J2~J5）
#
# 权威出处：`Ch7 §C.5`（参数化位置：`amplification_cap` / `gain_map` / `importance_threshold` / `max_depth`）
#           `Ch7 §C.2 ②`（重要性阈值）/ `§C.3`（深度默认 3）/ `§J3`（深度硬上限）/ `§J4`（放大上限阈值）
#           `Ch7 §J5`（未披露幅度**必须**用保守值键，不点估计）
#           值面终裁：`00_待拍板项清单.md::B3` · `00_交付施工图 §3.1`（本文件的计划落位）
#
# ★ 唯一真源：`scripts/graph/stop.py::load_transmit_params()` 只读本文件，
#   `scripts/transmit/**` 经它取参（`engine.py`：本模块**不内置任何数值门槛**）。
#   本文件缺失 → `load_transmit_params()` **响亮失败**（`FileNotFoundError`，不静默兜底）。
# ★ 只读、版本化、**模型不可写**（承 `Ch9 §N9.2-01`）。
#
# ★ 安装记录：2026-09-17 需求方裁定「均采用建议值」后由主理人安装。
#   此前 `rule_key_alignment_guard::KNOWN_ABSENT_RULE_FILES` 为它保留了一条
#   「按设计刻意未安装」的登记，其**预期消失条件 = 「`p04` 冻结后主理人安装本文件」** ——
#   本次安装即**满足该条件**，故那条登记**已同步撤除**（留着就是过期豁免；本仓纪律：
#   豁免必须随其消失条件一起清掉，否则豁免表本身变成新的漂移源）。
# ★ 每个字段的取值依据逐条写在下面；**没有一个值是臆造的**。

version: 1
spec_anchor: "Ch7 §C.5"

# 重要性阈值（`Ch7 §C.2 ②`）：`importance(hop) < importance_threshold`
# 且非 `unknown_but_important` 时停止深挖。
# 取 0.0 = **不因低重要性误停**（保守小值）：`Ch7 §C.2` 的设计意图是
# 「深度由重要性动态决定、非固定层数」，而首个可用值不应把真实链路剪掉。
# ＞0 的值属**业务裁量**，需需求方给出依据后再改（改本文件即生效，无需改代码）。
importance_threshold: 0.0

# 累计放大上限（`Ch7 §J4` / `N7.2-11`）：同一冲击不得在多层传导中被反复放大。
# ★ 取值 3.0 —— 依据 `00_待拍板项清单.md::B3`：
#   「**累计放大 ≤ 3×**（下游影响不超过冲击本身 3 倍）；参数化 `rules/transmission.yaml`〔新给〕」
#   （该档位为**需求方已给值**，优先级高于交付方在 `ws_ch7_transmit_report.md:168`
#    提出的占位保守值 `4.0`，故此处取 3.0。）
amplification_cap: 3.0

# 幅度/份额 → 增益映射（`Ch7 §J5`）。
# ★ `undisclosed` 是**保守键**（`scripts/graph/stop.py::GAIN_KEY_UNDISCLOSED`）：
#   未披露幅度**必须**走它，**不点估计**；`Hop.gain_key` 默认即 `undisclosed`。
#   取 1.0 = **不放大**（保守：未披露即按"无额外放大"处理，不虚构倍数）。
# 其余键随"幅度/份额"映射逐步积累；**在需求方给出业务映射前不预置猜测值** ——
#   缺键时 `stop.gain()` 会 `KeyError`（响亮失败），这正是「不静默兜底」的设计。
gain_map:
  undisclosed: 1.0

# 深度**硬性安全上限**（`Ch7 §C.3` / `§J3` / `N7.2-02`）。
# ★ 取值 5 —— 依据 `Ch7 §J3`：「传导深度上限默认值 | 3 / 5 / 无 | **硬上限 5 + 重要性动态剪枝**（`max_depth` 兜底）」。
#   与 `§C.3` 的 `forward_closure(max_depth=3)` 不冲突：**3 是闭包遍历的默认值、5 是传导的防御性上限**，
#   `§C.5` 明写"深度本身不固定（`N7.2-02`），由重要性动态决定，`max_depth` 仅作防御性上限"。
max_depth: 5
