# registry/sources.yaml —— 来源登记表（Ch9 §3.4.8 / §N9.3-01~11）
#
# 权威出处：`Ch9 §3.4.8 来源登记表结构`（字段 = 7 项登记字段 + source_id / tier /
#           quality_label / observed_stats / health）
#           `Ch9 §N9.3`（7 字段的信息价值见 §2.5.1）
#
# ★ 字段构成（7 项登记字段，`Ch9 §N9.3`）：
#   ① 公开入口 public_entry   ② 实际可获得内容 obtainable_content_type
#   ③ 抓取方式 crawl_method   ④ 可预期延迟 expected_latency
#   ⑤ 更新频率 update_frequency  ⑥ 访问限制 access_restriction
#   ⑦ 备选来源 fallback_source_ids
#
# ★ 质量标签纪律（N9.3-11）：`quality_label` **仅人工标注**（ground truth）；
#   `observed_stats` 为自动观测统计，**只能作辅助信号，不得被当作事实、
#   不得直接用于证据加权**；**不得以模型自评替代人工核验样本**。
#
# ★ 驱动逻辑：`可承诺时效 = min(update_freq + latency)`；
#   降级时 → 依赖对象标 `stale` + 显示延迟（T13）。
#
# ⚠️ 阶段① 的题目要求「公开数据登记」，因此**只登记接入面事实**，
#   **不填入任何猜测的业务数值**（源稿：不填入猜测的事实数值；未披露就显式存"未披露"）。
#   尚未核验的字段一律 `tbd`（口径占位），不得编造。
# 只读：本文件非 rules/，但同属"登记层"，由 pre-commit 的追加式规则保护。

version: 1
spec_anchor: "Ch9 §3.4.8"
registry_kind: source_registry
# 阶段① 交付物（`00_交付施工图 §2 阶段① 退出物`：registry/sources.yaml）

# 时效口径（N9.3-04/05）：可承诺时效**不得超过**来源更新频率所能支撑的范围
latency_policy:
  committable_timeliness: "min(update_frequency, expected_latency)"
  show_delayed_when_not_realtime: true     # 只有延迟行情时显示"延迟"与行情时间，不标实时

