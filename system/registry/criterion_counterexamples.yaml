    note: "WS-C 绑定（判据实现 = scripts/graph/traceability.py，stage_gate 复用）。
      反例：前置产物齐备（relations + impacts 非空，故阶段③ 不因前置缺失而 BLOCKED），
      但一条关系的 object_id 指向**不存在的节点** → 端点不可解析 → `GRAPHTRACE-REL-ENDPOINT` → 阶段③ exit 1。
      同用例内含**合规对照**（端点均可解析）断言该 hint **不出现**，证明判别力来自本判据本身、
