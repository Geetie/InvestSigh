    note: "批次 13-A 绑定（`Ch4 §G.2` 的校验器 = `scripts/valuelayer/completeness.py`）。反例：把 baseline 的 moat[]（④）与 valuation_inputs（⑤）两个 section 的载体清空 —— 字段在、值是合法空数组，但**实质没有内容** → `form_complete` 五项中 sections_nonempty/nonnull_rate 红 → 阶段② exit 1；合规输入（§G.2 五项 + §G.4 盈利分支全过）下该标记不出现。★ 该用例在**夹具副本**内自备 `rules/baseline.yaml`（§G.2 的阈值只从它读，G-06；真仓库那份尚不存在，故不写它就只能测到'规则缺失 ⇒ 无法判定'这一条）。"

  - stage: nvidia_sample
