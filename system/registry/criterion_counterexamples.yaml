      同用例内含**合规对照**（权威锚点正确）断言该 hint **不出现**。
      ★ 该反例钉在『T01–T14 的唯一权威表 = 10/01 §2.1』这一义务上（`N-01`：`10/02 §I.2` 的指向是错的）。"

