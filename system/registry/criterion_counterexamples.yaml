    test: tests/injection/test_criterion_effectiveness.py::test_daily_run_coverage_verifiable_blocks_on_illegal_depth
    blocked_hint: "CV2"
    note: "写一条 research_depth='bogus_depth' 的 company（不在四态内）→ 覆盖深度不可核 → 阶段④ exit 1。★ 该用例另有 `test_daily_run_coverage_verifiable_counterexample_is_load_bearing`：把副本里 coverage_check 换成空 CheckReport 后，**同一条反例即失效（exit 0）** —— 证明这条反例正好钉在审计所指的那个检查上"

  - stage: daily_run
    criterion_id: task_state_auditable
    kind: counterexample
    test: tests/injection/test_criterion_effectiveness.py::test_daily_run_task_state_auditable_blocks_on_illegal_status
    blocked_hint: "不在 TaskStatus 合法取值域内"
    note: "覆盖两种违反形态（同一判据、同一夹具）：① status='totally_bogus_status'（键在、值不在域内）；② 整行无 status 键。两者都 → 阶段④ exit 1，且违例带 task_id + 实际值 + 合法取值域（可逐行定位）。
      ★ 该用例另有 `test_daily_run_task_state_auditable_counterexample_is_load_bearing`：把副本里该判定行掏空（谓词置恒假）后 **exit 1 → 0** 而 criteria_bound **仍为 4** —— 证明这条反例正好钉在这处检查上，且证明「绑定数发现不了掏空」。
      ★ 出处：施工图 §2 阶段④ `all_tasks_have_status(run_window)` / Ch8 §C.2；取值域唯一真源 = schema/models.py::TaskStatus（G-06）。"

  # ───────────────────────────── 阶段⑤ expansion ────────────────────────────
  - stage: expansion
    criterion_id: review_append_only
    kind: ineffective
    test: tests/injection/test_criterion_effectiveness.py::test_expansion_review_append_only_missing_layer_is_not_a_violation
    reason: "「三层复盘齐备」**不是判据**（需求方 2026-09-17 裁定 `T-15`：把**退出物**升格成**通过判据** = 新增门槛，
      属 `施工图 §0` 第 1 条，不由实现方定）⇒ `WS-G` 已把 `stage_gate.py` 里那条「缺层 → Violation」
      （原第 792-794 行）**移除**，只保留**观测**（`expansion.layers_seen: k/3` + 计数）。
      故对『缺层』这一输入轴，阶段⑤ 的**违例集合与合规输入完全相同**：实测 `layers_seen` 由 3/3 变 2/3 或 1/3，
      但**不新增任何 `[FATAL]` 行** ⇒ 该轴**无判别力**（它已不是判据）。"
    note: "★ 本条由旧的 counterexample（`blocked_hint: 三层复盘缺层`）**改判**而来，**不是新发现**：
      `T-15` 修正前，缺层确实 append 一条 `Violation`，旧登记是**有效**的 counterexample；
      修正后该违例消失 ⇒ 旧断言不可能成立 ⇒ 按 `G-03` 改登记为 `ineffective`（**无判别力**），
      **而不是删除它** —— 保留 `T-15` 的裁定与理由供后人追溯（删掉会让『为什么没有缺层反例』无从查证）。
      ★ **观测必须保留**（`G-03`：不允许静默消失）：缺层虽不判违例，但 `layers_seen` 计数**必须照常输出** ——
      本探针测试（`..._missing_layer_is_not_a_violation`）同时钉住这一点（`layers_seen: 2/3` / `1/3` 可见）。
      ★ **未受影响**（`AC-01b`）：`review_append_only` 的**真判别力**（`Ch10 §D.5`「已声明过的层不得从记录集里消失」）
      仍由另两条 counterexample 守住，**未被误删**。
      ★ 设计侧佐证：`Ch10 §C.1` 只定义 `eval_layer` 的**取值域**；`§C.4:250` 的
      `assert layer in VALID_LAYERS` 亦为取值域断言；`施工图:215/234` 只在**退出物**里写了『三层复盘记录』。"

  - stage: expansion
    criterion_id: review_append_only
    kind: counterexample
    test: tests/injection/test_criterion_effectiveness.py::test_expansion_review_append_only_blocks_on_layer_disappearing
    blocked_hint: "消失（此前已声明过）"
    note: "★ 本批次 `G9-2` 补实现的**真 append-only 判别力**。逐字据 `Ch10 §D.5` 第 3 行「禁'只留赢的'：断言 某标的的复盘记录集合 ⊇ 其历史全部建议（含已验证失败者）」。
      反例：同一 task 在**追加序**上先声明三层（`eval_result_history`）、后只剩一层 ⇒ 「已声明过的层从记录集里消失」→ 阶段⑤ exit 1。
      ★ **为什么不与 `append_only_guard` 重复**（`G-06`）：该反例在 **diff 层完全合法**（纯追加、无既有行被改），`append_only_guard` 对它**必然放行**；它违反的是**语义**（历史被悄悄收窄）。两者被检面不重叠、互补。
      ★ 同用例内含**合法对照**（同一任务层集合**单调不减** → 该 hint 不出现），防止判据对多层任务无差别误报。"

  - stage: expansion
    criterion_id: review_append_only
    kind: counterexample
    test: tests/injection/test_criterion_effectiveness.py::test_expansion_review_append_only_blocks_when_guard_pathspec_misses_carrier
    blocked_hint: "未覆盖本函数所读的 facts/*.jsonl"
    note: "逐字据 `Ch10 §D.5` 第 2 行「append-only：复盘记录一次写入即不可改（承 `Ch9 §3.4.2` pre-commit 拒改既有行）」。
      ★ **读它的判据、不读它的输出文字**（`G-06`）：本用例把副本 `append_only_guard.facts_pathspec()` 改成指向别的 glob，断言阶段⑤ 变红且 `scanned aog_covers_carrier: 0`。
      ★ 为什么必须有这条：该守卫曾有**既有假绿** —— linked worktree 里钩子导出的 `GIT_DIR` 让 `rev-parse --show-toplevel` 返回 cwd ⇒ pathspec 指错 ⇒ `git diff --cached` **恒空** ⇒ 对任何输入都放行（`G-RC-12`）。『机制存在』≠『机制在这个真源上生效』。"

  - stage: expansion
    criterion_id: review_append_only
    kind: ineffective
    test: tests/injection/test_criterion_effectiveness.py::test_expansion_review_append_only_outcome_categories_have_no_check
    reason: "`Ch10 §D.5` 第 1 行「三类记录齐全：成功 / 失败 / pending（待判断）各有结构性记录，不可选择性删除」**无可检对象**：`success`/`failure`/`pending` 三元组在**整个代码区只出现 1 次**（`registry/delivery.yaml:132` 的声明本身），`schema/models.py` 无对应枚举、`facts/*.jsonl` 无对应字段。故探针实测：把 outcome 由 success/failure/pending 混搭改成**全 success**（字面语义上的『只留赢的』）→ 阶段⑤ 违例集合**完全相同**"
    note: "★ **临时登记，不是『这条路没问题』**：原因是**载体未定**（等需求方定，见张力 **`T-17`**）。
      ★ **已裁定（需求方 2026-09-17：「`T-17` 一律采取主理人推荐值」）**：`success/failure/pending`
      三类记录**无载体** ⇒ 按 `G-03` **显式记账为缺口**（**不算通过、也不算违例**）；**不**新建表/字段/enum
      （载体属设计决定 —— `T-11`/`T-12` 的先例是**折叠进既有表**或**上报**，不是自造）。
      补实现的提交号见 `reports/ws_criterion_effectiveness_report.md §3 G9-2`。实现后本探针**当场变红**，
      强制更新本登记（铁律 5）。按 `G-03` 显式记账为『无被检对象』，**不计为已验证**。
