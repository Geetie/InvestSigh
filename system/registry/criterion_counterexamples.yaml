# registry/criterion_counterexamples.yaml —— **判据反例登记表**（缺口 `G9`）
#
# 权威出处：`CONVENTIONS.md` 铁律（「声明」与「实现」必须有机器绑定）+ `R-06`（判据须可判定 + 穷尽）
#           + `G-03`（无被检对象 ≠ 已验证）
#
# ## 本表要解决的缺口
#
# `scripts/delivery/stage_gate.py` 的 `criterion("<stage>", "<id>", v)` 是**机器绑定**：
# `bound_criteria()` 用 AST 抽出函数体内的字面量，`assert_criteria_implemented()` 据此
# 把"YAML 声明为 automated"与"函数体真的绑了"做机器比对。
#
# ★ 但绑定只证明「**接了**」，不证明「**真的在查**」。独立审计实测（本表建立时的复现）：
#   把 `cv = coverage_check(root)` 换成空 `CheckReport` → `scanned daily_run.criteria_bound: 4`
#   **不变**，而不达标数据（`research_depth='bogus_depth'`）下门禁 `exit=0`（变绿）。
#
# ## 义务（由 `scripts/checks/criterion_effectiveness_guard.py` 强制）
#
# 1. **每一项已绑定（bound）的 automated 判据，必须在本表有一条登记** ——
#    新绑一条判据却不登记 → 门禁 FATAL（`exit 1`）。这是本表的**唯一存在理由**。
# 2. 登记里不得出现**未绑定/未声明**的判据（防"预登记"绕过第 1 条）。
# 3. 每条登记指向的测试必须**真的存在**（用 AST 扫 `tests/**` 收集 `def test_*` 比对），
#    且**测试函数名必须含判据 id**（防把登记改指向一个与本判据无关的、恒过的用例）。
#
# ## kind 的两种取值
#
# - `counterexample`：存在**不合规输入**，使该阶段门禁对该输入 `exit != 0`，
#   且输出里出现 `blocked_hint`（该判据**专属**的拦截标记）。测试同时断言：
#   合规输入下该 hint **不出现**（证明这条反例不是靠别的判据"顺带变红"）。
# - `ineffective`：**实测无判别力** —— 找不到任何不合规输入能让该**方面**
#   改变门禁的违例集合。此时必须给出 `reason`，且测试必须**断言"
#   不合规输入下的违例集合与合规输入完全相同"**。
#
# ★ 同一判据**可以有多条**条目（并允许同时有这两种 kind）：一条判据本来就可能有多条
#   **互不重叠的违反轴**，压成一条会丢失证据。
#   去重口径 = 「**测试路径全局唯一**」（防同一测试冒充多条证据），**不是**判据级唯一。
#   本表的 `expansion::review_append_only` 是最全的例子：3 条 `counterexample`
#   （三层缺层 / 已声明层消失 / append-only 守卫没罩住本真源）+ 1 条 `ineffective`
#   （`(success, failure, pending)` 三类记录**无载体**，按 `G-03` 显式记账）。
#
#   ★ 为什么 `ineffective` 不是"改一行数据就绕过"的口子：那条探针测试若判据其实有判别力
#     **当场就红**。所以"谎报 ineffective"要付出写一个必然失败的测试的代价，
#     而不是一行数据编辑（项目铁律 5）。
#   ★ `ineffective` 的条目会被门禁**逐条计入 note 并计数**（`G-03`：不得静默）。
#
# ## 只读
# 本文件可写（`registry/**` 可写）；`rules/**` 才是 0444。

version: 1
spec_anchor: "CONVENTIONS.md（铁律：声明↔实现机器绑定）/ R-06 / G-03 / G-06"
stage_gate: "scripts/delivery/stage_gate.py"
guard: "scripts/checks/criterion_effectiveness_guard.py"

counterexamples:
