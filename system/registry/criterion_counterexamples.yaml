    blocked_hint: "LOCATOR_UNRECOGNIZED"
    note: "缺口 `G-50`：`evidence_locatable`（`Ch6 §D`）的检查器 `scripts/validators/locator_check.py` **早已实现**、且**已有生产调用方**（`scripts/orchestrate/chain_steps.py`），但阶段② 的 `stage_nvidia_sample_passed()` 函数体**没有绑定** ⇒ 接线接在了**错的层**（有实现 + 有调用方 + 判据没绑）。本卡在函数体内复用该校验器并绑 `criterion(...)`。反例：夹具里只翻转一条 claim 的 `locator` 一个字段 —— 合规定位 `raw/notes.txt#L1-L2` ⇒ `LOCATOR_UNRECOGNIZED` 不出现；非机械可复查串 ⇒ 阶段② exit 1 且该码出现（单变量对照 ⇒ 判别力归因成立）。★ 该反例落 `tests/unit/**`（新文件）：本卡禁改 `verify.py`，而 `tests/injection/**` 新文件必须显式入片（`verify.py::BATCHES`）才行，`tests/unit/` 的批次目标是**目录** ⇒ 新文件自动被 V-06 覆盖（`criterion_effectiveness_guard` 扫 `tests/**`，判据反例落 unit 或 injection 对它等价）。"

  # ──────────────────────────── 阶段③ core_chain ────────────────────────────
  - stage: core_chain
