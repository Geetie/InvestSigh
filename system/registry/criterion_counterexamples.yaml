    kind: counterexample
    test: tests/injection/test_criterion_effectiveness.py::test_daily_run_timing_replayable_blocks_on_missing_run_date
    blocked_hint: "缺 run_date"
    note: "把 check_record.run_date 删掉 → 时点不可核 → 阶段④ exit 1；★ 该用例同时断言合规输入下阶段④ **exit 0**（判别力来自判据本身，不是别的判据顺带变红）"

  - stage: daily_run
    criterion_id: degrade_keeps_last_valid
    kind: counterexample
    test: tests/injection/test_criterion_effectiveness.py::test_daily_run_degrade_keeps_last_valid_blocks_on_dropped_ref
    blocked_hint: "失败但未保留 last_valid_result_ref"
    note: "「先正常完成持有产出、后失败且丢引用」→ 引用本该在却被置空 → 阶段④ exit 1（首日豁免不适用）"

  - stage: daily_run
