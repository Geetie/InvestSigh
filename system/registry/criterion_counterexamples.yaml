    kind: counterexample
    test: tests/graph/test_core_chain_acceptance.py::test_core_chain_t01_t14_all_pass_blocks_on_ledger_drift
    blocked_hint: "ACC-AUTHORITY"
    note: "WS-C 绑定（判据实现 = scripts/graph/acceptance.py，逐条判定器 = scripts/graph/acceptance_checks.py）。
      反例：前置产物齐备，但把 T01–T14 台账 `registry/acceptance_input_set.yaml` 的
